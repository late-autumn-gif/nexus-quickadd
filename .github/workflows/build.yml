name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build exe (framework csc, no SDK needed)
        shell: pwsh
        run: ./build.ps1

      - name: Package release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/NexusQuickAdd.exe out/
          Copy-Item dist/NexusQuickAdd-Setup.exe out/
          Copy-Item README.md, LICENSE, CHANGELOG.md out/
          Compress-Archive -Path out/* -DestinationPath NexusQuickAdd-win-x64.zip -Force
          Get-ChildItem dist/NexusQuickAdd.exe, NexusQuickAdd-win-x64.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: NexusQuickAdd
          path: |
            dist/NexusQuickAdd.exe
            dist/NexusQuickAdd-Setup.exe
            NexusQuickAdd-win-x64.zip
